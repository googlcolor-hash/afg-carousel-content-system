<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АФГ - production экспорт каруселей</title>
  <meta name="description" content="Production-рендерер 1080x1350 для трех AFG каруселей.">
  <style>
    :root {
      --ink: #18221f;
      --muted: #61716b;
      --paper: #f5f7f2;
      --line: rgba(24, 34, 31, .12);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #dfe6dd;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", system-ui, -apple-system, sans-serif;
      letter-spacing: 0;
    }

    body.export-mode {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: var(--paper);
    }

    a {
      color: inherit;
    }

    .page {
      width: min(100%, 1320px);
      margin: 0 auto;
      padding: 42px 24px 72px;
    }

    .export-mode .page {
      width: 1080px;
      height: 1350px;
      margin: 0;
      padding: 0;
    }

    .overview {
      display: grid;
      gap: 20px;
      margin-bottom: 28px;
    }

    .export-mode .overview {
      display: none;
    }

    .overview h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 88px);
      line-height: .92;
      letter-spacing: 0;
      max-width: 980px;
    }

    .overview p {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.45;
      font-weight: 650;
    }

    .overview nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .overview a {
      border: 1px solid rgba(49, 95, 76, .22);
      border-radius: 8px;
      padding: 12px 14px;
      background: #fff;
      text-decoration: none;
      color: #315f4c;
      font-weight: 850;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 28px;
    }

    .export-mode .sheet {
      display: block;
    }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      isolation: isolate;
      background: var(--paper);
    }

    .sheet:not(.single) .slide {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      box-shadow: 0 24px 70px rgba(24, 34, 31, .18);
    }

    .art {
      position: absolute;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background:
        linear-gradient(135deg, var(--base-a), var(--base-b) 54%, var(--base-c)),
        var(--paper);
    }

    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .14) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: .45;
      mix-blend-mode: soft-light;
    }

    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(24, 34, 31, .12) 44%, rgba(24, 34, 31, .72)),
        radial-gradient(circle at 16% 16%, rgba(255, 255, 255, .34), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(255, 255, 255, .14), transparent 34%);
    }

    .mark {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, .24);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, .06)),
        rgba(255, 255, 255, .08);
      box-shadow: 0 32px 90px rgba(24, 34, 31, .24);
    }

    .mark-a {
      right: 70px;
      top: 168px;
      width: 318px;
      height: 418px;
      border-radius: 8px;
      transform: rotate(var(--rotate-a));
    }

    .mark-b {
      left: 86px;
      top: 188px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      opacity: .68;
      transform: scale(var(--scale-b));
    }

    .mark-c {
      right: 166px;
      bottom: 254px;
      width: 250px;
      height: 28px;
      border-radius: 999px;
      opacity: .74;
      transform: rotate(var(--rotate-c));
    }

    .axis {
      position: absolute;
      inset: 0;
      opacity: .62;
      background:
        linear-gradient(90deg, transparent 49.7%, rgba(255, 255, 255, .32) 49.7%, rgba(255, 255, 255, .32) 50.3%, transparent 50.3%),
        linear-gradient(0deg, transparent 66%, rgba(255, 255, 255, .2) 66%, rgba(255, 255, 255, .2) 66.4%, transparent 66.4%);
      mask-image: linear-gradient(180deg, transparent, #000 14%, #000 82%, transparent);
    }

    .thread {
      position: absolute;
      left: -8%;
      top: var(--thread-top);
      width: 118%;
      height: 220px;
      opacity: .35;
      background:
        repeating-linear-gradient(var(--thread-angle), rgba(255, 255, 255, .52) 0 3px, transparent 3px 28px);
      transform: rotate(var(--thread-tilt));
      mix-blend-mode: soft-light;
    }

    .motif {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .motif span {
      position: absolute;
      display: block;
      opacity: .72;
    }

    .frame {
      position: absolute;
      inset: 72px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: #fff;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 28px;
      font-size: 28px;
      font-weight: 900;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 7px rgba(255, 255, 255, .16);
    }

    .copy {
      align-self: end;
      padding-bottom: 34px;
    }

    .eyebrow {
      display: inline-flex;
      border: 2px solid rgba(255, 255, 255, .42);
      border-radius: 999px;
      padding: 17px 22px;
      margin-bottom: 34px;
      background: rgba(255, 255, 255, .14);
      color: rgba(255, 255, 255, .92);
      font-size: 24px;
      font-weight: 900;
    }

    h2 {
      max-width: 885px;
      margin: 0;
      color: #fff;
      font-size: var(--title-size);
      line-height: .94;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .body {
      max-width: 770px;
      margin: 34px 0 0;
      color: rgba(255, 255, 255, .9);
      font-size: var(--body-size);
      line-height: 1.14;
      font-weight: 650;
      text-wrap: balance;
    }

    .bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
    }

    .tag {
      max-width: 650px;
      border: 2px solid rgba(255, 255, 255, .38);
      border-radius: 999px;
      padding: 18px 24px;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.08;
    }

    .count {
      color: rgba(255, 255, 255, .82);
      font-size: 26px;
      font-weight: 900;
      white-space: nowrap;
    }

    .slide {
      --base-a: #f4f6f2;
      --base-b: #6e8a78;
      --base-c: #26372f;
      --rotate-a: -6deg;
      --scale-b: 1;
      --rotate-c: -9deg;
      --thread-top: 300px;
      --thread-angle: 90deg;
      --thread-tilt: -6deg;
      --title-size: 104px;
      --body-size: 46px;
    }

    .series-1 {
      --base-a: #d9e3d5;
      --base-b: #557461;
      --base-c: #1f2d28;
    }

    .series-2 {
      --base-a: #f3f6ed;
      --base-b: #8fab95;
      --base-c: #244f40;
    }

    .series-3 {
      --base-a: #f0ece2;
      --base-b: #63766e;
      --base-c: #10272b;
    }

    .slide-1 {
      --rotate-a: -7deg;
      --scale-b: 1.2;
      --thread-top: 184px;
      --thread-angle: 62deg;
      --thread-tilt: -8deg;

      mask-image: linear-gradient(180deg, transparent, #000 8%, #000 88%, transparent);
    }

    .series-2 .thread {
      left: 54px;

    }

    .series-2 .mark-a {
      right: 90px;

    .series-2 .mark-a::before,

    .series-2 .mark-c {

    .series-3.slide-7 { --base-b: #8e6758; }

    .sheet:not(.single) .frame {
      inset: 7%;
    }

    .sheet:not(.single) .topline,
    .sheet:not(.single) .tag,
    .sheet:not(.single) .count {
      font-size: 2.5vw;
    }

    .sheet:not(.single) .eyebrow {
      font-size: 2.2vw;
      padding: 1.4vw 1.8vw;
      margin-bottom: 2.6vw;
    }

    .sheet:not(.single) h2 {
      font-size: clamp(34px, 7.8vw, 76px);
    }

    .sheet:not(.single) .body {
      font-size: clamp(18px, 3.6vw, 34px);
      margin-top: 2.8vw;
    }

    @media (max-width: 720px) {
      .page {
        padding-inline: 14px;
      }

      .sheet:not(.single) .topline,
      .sheet:not(.single) .tag,
      .sheet:not(.single) .count {
        font-size: 12px;
      }

      .sheet:not(.single) .eyebrow {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="overview" aria-label="Production overview">
      <h1>Production экспорт АФГ</h1>
      <p>Три готовые карусели в формате 1080x1350. Для экспорта одного кадра используйте параметры <strong>?carousel=1&slide=1</strong>.</p>
      <nav aria-label="Карусели">
        <a href="carousel-production.html?carousel=1">Карусель 1</a>
        <a href="carousel-production.html?carousel=2">Карусель 2</a>
        <a href="carousel-production.html?carousel=3">Карусель 3</a>
      </nav>
    </section>
    <section id="sheet" class="sheet" aria-label="Production slides"></section>
  </main>

  <script>
    const carousels = {
      1: {
        title: "Как проходит занятие?",
        series: "Карусель 1",
        tag: "Визуал: человек и телесная опора",
        slides: [
          ["Как проходит занятие АФГ?", "Не тренировка на износ, а короткая встреча тела с собственной опорой.", "Визуал: человек в тихой студии"],
          ["Сначала тело настраивается", "Важно замедлиться, почувствовать стопы, дыхание, ось и контакт с собой.", "Визуал: дыхание и восстановление"],
          ["Скелет как фундамент", "В фокусе не только мышцы, а глубинная опора: кость, ось, устойчивость.", "Визуал: кость и архитектура"],
          ["Мягкая осевая нагрузка", "Нагрузка идет бережно и контролируемо, через естественные векторы тела.", "Визуал: круговая деталь руки или стопы"],
          ["Коротко, но точно", "Обычно это занимает меньше времени, чем классическая тренировка, но требует внимания.", "Визуал: таймер и спокойный ритм"],
          ["После - проверка состояния", "Человек сравнивает ощущения: устойчивость, дыхание, тонус, собранность.", "Визуал: спокойная стойка после занятия"],
          ["Главное - почувствовать", "АФГ лучше объяснять через опыт: до занятия и после занятия.", "Визуал: вход в студию / приглашение"]
        ]
      },
      2: {
        title: "Что дает занятие?",
        series: "Карусель 2",
        tag: "Визуал: ресурс без давления",
        slides: [
          ["Что может дать занятие?", "Не обещание исправить все, а возможность вернуть телу ощущение опоры.", "Визуал: тело как спокойная система"],
          ["Больше телесной собранности", "Когда скелет воспринимается как фундамент, движения становятся спокойнее и точнее.", "Визуал: точные линии движения"],
          ["Ось вместо хаоса", "Мягкая нагрузка помогает телу заметить вертикаль: стопы, таз, позвоночник, плечи, голову.", "Визуал: вертикальная ось тела"],
          ["Психика чувствует физику", "Когда тело ощущает опору, внутреннее состояние тоже может становиться устойчивее.", "Визуал: дыхание и равный ритм"],
          ["Ресурс без давления", "Формат не требует изматывать себя. Его ценность в точности и уважении к состоянию.", "Визуал: мягкая нагрузка"],
          ["Глубина приходит через регулярность", "Один опыт может быть заметным, но глубина раскрывается через последовательность.", "Визуал: серия спокойных шагов"],
          ["Почувствовать лучше, чем объяснять", "Запишитесь на занятие АФГ и сравните свое состояние до и после практики.", "Визуал: приглашение на пробное занятие"]
        ]
      },
      3: {
        title: "Доказательства",
        series: "Карусель 3",
        tag: "Визуал: proof layer без категоричных обещаний",
        slides: [
          ["Почему это не просто новая тренировка?", "У метода есть контекст: наука о нагрузке, мировая практика и реальные истории людей.", "Визуал: строгая обложка"],
          ["Кость - живая ткань", "Она реагирует на нагрузку, особенно когда та точная, дозированная и безопасно организованная.", "Визуал: кость как живой материал"],
          ["OsteoStrong как proof layer", "В мире есть направление студий, построенных вокруг остеогенной нагрузки и работы с опорой тела.", "Статус: проверить формулировку"],
          ["Страны, студии, признание", "Формат развивается в разных странах как часть wellness-подхода к ресурсу тела.", "Визуал: карта мира, тонкие линии"],
          ["Профилактика и качество жизни", "На отдельных рынках похожие практики рассматриваются в логике поддержки активного долголетия.", "Статус: мягкая формулировка"],
          ["Космос как научный контекст", "Тема костной плотности в невесомости показывает, почему нагрузка костной ткани важна для науки.", "Визуал: космос и структура кости"],
          ["И есть человеческий опыт", "Отзывы лучше подавать как личные истории, а не как гарантию результата.", "Визуал: человек, спокойный портрет"]
        ]
      }
    };

    const params = new URLSearchParams(window.location.search);
    const carouselId = Number(params.get("carousel") || 1);
    const slideId = Number(params.get("slide") || 0);
    const data = carousels[carouselId] || carousels[1];
    const sheet = document.querySelector("#sheet");

    if (slideId) {
      document.body.classList.add("export-mode");
      sheet.classList.add("single");
    }

    const selectedSlides = slideId
      ? [[slideId, data.slides[Math.max(0, Math.min(data.slides.length - 1, slideId - 1))]]]
      : data.slides.map((slide, index) => [index + 1, slide]);

    function renderSlide(index, slide) {
      const [title, body, tag] = slide;
      const node = document.createElement("article");
      node.className = `slide series-${carouselId} slide-${index}`;
      node.setAttribute("aria-label", `${data.series}, слайд ${index}`);
      node.innerHTML = `
        <div class="art" aria-hidden="true">
          <div class="axis"></div>
          <div class="thread"></div>
          <div class="mark mark-a"></div>
          <div class="mark mark-b"></div>
          <div class="mark mark-c"></div>
          <div class="motif">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="frame">
          <div class="topline">
            <span class="brand">AFG</span>
            <span>${data.series}</span>
          </div>
          <div class="copy">
            <span class="eyebrow">${data.title}</span>
            <h2>${title}</h2>
            <p class="body">${body}</p>
          </div>
          <div class="bottom">
            <span class="tag">${tag}</span>
            <span class="count">${String(index).padStart(2, "0")} / 07</span>
          </div>
        </div>
      `;
      return node;
    }

    selectedSlides.forEach(([index, slide]) => {
      sheet.appendChild(renderSlide(index, slide));
    });
  </script>
</body>
</html>
